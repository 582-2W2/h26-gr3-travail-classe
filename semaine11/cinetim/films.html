<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéTIM - Films</title>
  <link rel="icon" type="image/png" href="ressources/images/favicon.png">
  <link rel="stylesheet" href="ressources/css/styles.css">
  <script src="ressources/data/films.js"></script>
  <script src="ressources/js/main.js" defer></script>
</head>

<body>
  <header>
    <div class="logo">CinéTIM</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="films.html" aria-current="page">Films</a>
      <a href="apropos.html">À propos</a>
    </nav>
  </header>

  <main id="page-films">
    <h1>Films proposés</h1>

    <!-- Bouton et formulaire pour proposer un film -->
    <button type="button" class="btn-proposer">Proposer un film</button>
    <form id="frm-ajouter-film" method="post">
      <h2>Nouveau film</h2>
      <div class="champ">
        <label for="film-titre">Titre</label>
        <input 
          type="text" 
          name="titre" 
          id="film-titre" 
          placeholder="Titre original"
        >
      </div>
      <div class="champ">
        <label for="film-synopsis">Synopsis</label>
        <textarea 
          name="synopsis" 
          id="film-synopsis" 
          placeholder="Court synopsis du film"
          rows="3"
        ></textarea>
      </div>
      <div class="champ">
        <label for="film-vignette">Vignette</label>
        <input 
          type="text" 
          name="vignette" 
          id="film-vignette" 
          placeholder="Nom du fichier image"
        >
      </div>
      <div class="actions">
        <button type="button" class="btn-ajouter">Ajouter</button>
        <button type="reset" class="btn-annuler">Annuler</button>
      </div>
    </form>

    <!-- Affichage des films proposés -->
    <section 
      class="grille grille-films" 
      aria-label="Liste des films proposés"
    ></section>
  </main>

  <footer>
    <small>© 2026 CinéTIM</small>
  </footer>

  <template id="gabarit-film">
    <article class="tuile">
      <figure>
        <img src="ressources/images/films/VIGNETTE" alt="ALT">
        <figcaption>TITRE</figcaption>
      </figure>
      <p class="description">SYNOPSIS</p>
    </article>
  </template>
</body>

</html>
