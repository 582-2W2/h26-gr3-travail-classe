<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 - createElement() et append()</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fff4d6, #ffd7b5 45%, #ffc4d6);
            color: #3a1f16;
            padding: 1.25rem;
        }

        .demo {
            width: min(100%, 42rem);
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #f59e0b;
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 0 1rem 2rem rgba(58, 31, 22, 0.15);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-bottom: 0.9rem;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 0.65rem 1rem;
            font: inherit;
            color: white;
            background: linear-gradient(90deg, #d97706, #f59e0b);
            cursor: pointer;
        }

        .monstres {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.6rem;
        }

        .monstre {
            border: 1px solid #fdba74;
            border-radius: 0.75rem;
            padding: 0.65rem 0.8rem;
            background: #fffbeb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: apparition 260ms ease-out;
        }

        .monstre.nouveau {
            outline: 2px dashed #f97316;
            animation: pulse 480ms ease 2;
        }

        .badge {
            font-size: 0.85rem;
            background: #fed7aa;
            border-radius: 999px;
            padding: 0.2rem 0.55rem;
        }

        .info {
            margin-top: 0.8rem;
            font-weight: 700;
        }

        @keyframes apparition {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
    <section class="demo">
        <h1>Exemple 1 - Créer des monstres avec createElement() + append()</h1>
        <p>Objectif : compléter la logique pour ajouter des cartes dynamiques.</p>

        <div class="actions">
            <button class="btn-ajouter" type="button">Ajouter un monstre</button>
            <button class="btn-reset" type="button">Réinitialiser</button>
        </div>

        <ul class="monstres">

        </ul>
        <p class="info">Monstres créés : <span class="compteur">0</span></p>
    </section>

    <script>
        const listeMonstres = document.querySelector('.monstres');
        const boutonAjouter = document.querySelector('.btn-ajouter');
        const boutonReset = document.querySelector('.btn-reset');
        const compteur = document.querySelector('.compteur');

        const creatures = ['Blob Disco', 'Dragon Marshmallow', 'Lama Ninja', 'Robot Banane', 'Pieuvre Turbo'];
        let compteMonstres = 0;
        
        boutonAjouter.addEventListener("click", ()=>{
            // Retirer la classe "nouveau" de tous les monstres
            // C'est à dire de tous les LI qui sont enfant de UL
            for (const unLi of listeMonstres.children) {
                unLi.classList.remove("nouveau");
            }

            // NE MARCHE PAS car children n'est pas ARRAY
            // listeMonstres.children.forEach(
            //     (unLi) => unLi.classList.remove("nouveau")
            // );


            const posAlea = Math.floor(Math.random()*creatures.length);
            
            const eltMonstre = document.createElement("li");
            eltMonstre.classList.add("monstre", "nouveau");
            eltMonstre.textContent = creatures[posAlea];

            // Créer l'élément dans le DOM
            const eltBadge = document.createElement("span");
            // Lui assigner une ou des classes CSS
            eltBadge.classList.add("badge");
            // Insérer du texte DANS l'élément
            eltBadge.innerText = "nouveau";
            // Injecter l'élément dans la hiérarchie de la page
            // Dans ce cas précis on veut le badge à l'intérieur du LI
            eltMonstre.append(eltBadge);

            
            listeMonstres.append(eltMonstre);

            // Incrémenter le compte des monstres...
            compteMonstres++;
            // ... et l'injecter dans l'élément adéquat
            compteur.textContent = compteMonstres;

            console.log("Les enfants de la liste des monstres : ", 
                listeMonstres.children);
            

        });

        boutonReset.addEventListener("click", ()=>listeMonstres.innerHTML="")
    </script>
</body>
</html>
