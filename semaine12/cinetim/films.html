<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéTIM - Films</title>
  <link rel="icon" type="image/png" href="ressources/images/favicon.png">
  <link rel="stylesheet" href="ressources/css/styles.css">
  <script src="ressources/data/films.js"></script>
  <script src="ressources/js/main.js" defer></script>
</head>

<body>
  <header>
    <div class="logo">CinéTIM</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="films.html" aria-current="page">Films</a>
      <a href="apropos.html">À propos</a>
    </nav>
  </header>

  <main id="page-films">
    <h1>Films proposés</h1>

    <div class="recherche-films">
      <input type="text" name="mot-cle" placeholder="Recherchez par titre et/ou synopsis">
    </div>

    <button id="btn-proposer-film" class="btn-proposer">Proposer un film</button>

    <form id="form-ajouter-film" class="form-film cache" novalidate>
      <h2>Nouveau film</h2>
      <div class="form-champ">
        <label for="film-titre">Titre</label>
        <input type="text" id="film-titre" name="titre" placeholder="Ex: Frankenstein" required>
      </div>
      <div class="form-champ">
        <label for="film-synopsis">Synopsis</label>
        <textarea id="film-synopsis" name="synopsis" rows="3" placeholder="Résumé du film…" required></textarea>
      </div>
      <div class="form-champ">
        <label for="film-vignette">Fichier image (nom)</label>
        <input type="text" id="film-vignette" name="vignette" placeholder="Ex: frankenstein.png" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-ajouter" id="btn-ajouter-film">Ajouter</button>
        <button type="reset" id="btn-annuler-film">Annuler</button>
      </div>
    </form>
    
    <section class="grille grille-films" aria-label="Liste des films proposés">
      
    </section>
  </main>

  <footer>
    <small>© 2026 CinéTIM</small>
  </footer>

  <template id="gabarit-film">
    <article class="tuile">
      <button type="button" class="btn-supprimer">🗑️</button>
      <figure>
        <img src="ressources/images/films/VIGNETTE" alt="ALT">
        <figcaption>TITRE</figcaption>
      </figure>
      <p class="description">SYNOPSIS</p>
    </article>
  </template>
</body>

</html>
