<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 - Indicateur de chargement</title>
    <style>
        :root {
            --fond: black;
            --texte: white;
            --anneau: rgb(187, 187, 206);
            --accent: rgb(127, 47, 47);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--fond);
            color: var(--texte);
            text-align: center;

            .boite {
                display: grid;
                gap: 1rem;

                .spinner {
                    width: 5rem;
                    height: 5rem;
                    border: 1rem solid var(--anneau);
                    border-top-color: var(--accent);
                    border-radius: 50%;
                    margin-inline: auto;
                    animation: chargement 1s alternate infinite;
                }
            }
        }

        @keyframes chargement {
            from {
                rotate: 0deg;
                scale: 1;
            }
            to {
                rotate: 360deg;
                scale: 1.2;
            }
        }
    </style>
</head>
<body>
    <div class="boite">
        <h1>Animation du UI : indicateur de chargement</h1>
        <div class="spinner"></div>
    </div>
    
</body>
</html>
